<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>HD2 武器数值编辑器</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --panel2: #232733; --line: #2e3444;
    --fg: #e6e9ef; --dim: #8b93a7; --accent: #ffd166; --ok: #4ade80;
    --warn: #fbbf24; --bad: #f87171; --edit: #60a5fa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  .stats { color: var(--dim); font-size: 12px; }
  .wrap { display: flex; height: calc(100vh - 53px); }

  /* ---- weapon list ---- */
  aside { width: 340px; border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  .filters { padding: 10px; border-bottom: 1px solid var(--line); display: flex; gap: 6px; flex-wrap: wrap; }
  input[type=search] {
    flex: 1 1 100%; background: var(--panel2); border: 1px solid var(--line);
    color: var(--fg); padding: 7px 10px; border-radius: 6px; font: inherit;
  }
  .chip {
    background: var(--panel2); border: 1px solid var(--line); color: var(--dim);
    padding: 4px 9px; border-radius: 20px; cursor: pointer; font-size: 11.5px; user-select: none;
  }
  .chip.on { background: var(--accent); color: #1a1a1a; border-color: var(--accent); font-weight: 600; }
  ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  li {
    padding: 9px 14px; border-bottom: 1px solid #23262f; cursor: pointer;
    display: flex; justify-content: space-between; gap: 10px; align-items: center;
  }
  li:hover { background: var(--panel2); }
  li.sel { background: #2a3145; border-left: 3px solid var(--accent); padding-left: 11px; }
  .nm { font-weight: 500; }
  .sub { color: var(--dim); font-size: 11px; }
  .badge { font-size: 10px; padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
  .b-shared { background: #4a3a1a; color: var(--warn); }
  .b-expl { background: #1e3a4a; color: #7dd3fc; }
  .b-unver { background: #4a1f1f; color: var(--bad); }

  /* ---- editor ---- */
  main { flex: 1; overflow-y: auto; padding: 22px 26px; }
  .empty { color: var(--dim); margin-top: 40px; text-align: center; }
  h2 { font-size: 18px; margin: 0 0 3px; }
  .meta { color: var(--dim); font-size: 12px; margin-bottom: 18px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .card h3 { margin: 0 0 12px; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--dim); font-weight: 600; }
  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 11px; }
  .row label { width: 120px; color: var(--dim); font-size: 12px; }
  .row .was { color: var(--dim); font-size: 12px; min-width: 62px; }
  input[type=number] {
    width: 110px; background: var(--panel2); border: 1px solid var(--line);
    color: var(--fg); padding: 6px 9px; border-radius: 6px; font: inherit;
  }
  input[type=number]:focus { outline: none; border-color: var(--edit); }
  input[type=number].changed { border-color: var(--edit); background: #1e2a3f; color: #bfdbfe; }
  .note { color: var(--dim); font-size: 11.5px; margin-top: 4px; }
  .banner { border-radius: 8px; padding: 11px 14px; margin-bottom: 14px; font-size: 12.5px; border: 1px solid; }
  .banner.warn { background: #3a2f14; border-color: #6b5518; color: #fde68a; }
  .banner.bad { background: #3a1a1a; border-color: #6b2020; color: #fecaca; }
  .banner.info { background: #16283a; border-color: #27496b; color: #bae6fd; }
  .banner b { color: #fff; }
  .btns { display: flex; gap: 10px; margin-top: 6px; }
  button {
    background: var(--panel2); border: 1px solid var(--line); color: var(--fg);
    padding: 8px 16px; border-radius: 6px; cursor: pointer; font: inherit;
  }
  button:hover { border-color: var(--dim); }
  button.primary { background: var(--accent); color: #1a1a1a; border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  code { background: var(--panel2); padding: 1px 5px; border-radius: 4px; font-size: 11.5px; }
</style>
</head>
<body>
<header>
  <h1>HD2 武器数值编辑器</h1>
  <span class="stats" id="stats">载入中…</span>
</header>

<div class="wrap">
  <aside>
    <div class="filters">
      <input type="search" id="q" placeholder="搜索武器 / 弹种…">
      <span class="chip on" data-f="verified">仅已验证</span>
      <span class="chip" data-f="exclusive">仅独占</span>
      <span class="chip" data-f="explosion">爆炸类</span>
    </div>
    <ul id="list"></ul>
  </aside>
  <main id="main">
    <div class="empty">← 从左侧选择一把武器</div>
  </main>
</div>

<script>
let DATA = null, SEL = null;
const EDITABLE = ["damage", "durable", "ap0", "ap1", "ap2", "ap3", "demolition_strength", "force_strength", "force_impulse"];

function fmt(n) { return n === null || n === undefined ? "—" : n; }

async function boot() {
  const r = await fetch("/api/weapons");
  DATA = await r.json();
  const v = DATA.weapons.filter(w => w.verified).length;
  // Count a weapon as exclusive only when BOTH of its damage records are
  // unshared; the old count looked at the explosion row alone and overstated
  // how many weapons can be edited without affecting others.
  const excl = DATA.weapons.filter(w => w.exclusive && w.impact_exclusive).length;
  document.getElementById("stats").textContent =
    `${DATA.weapons.length} 把武器 · ${v} 已验证 · ${excl} 完全独占 · ${DATA.unmatched.length} 未匹配`;
  // Deep link: ?weapon=R-4+Hyena preselects that weapon and clears the
  // verified-only filter, so a page opened for a specific gun shows it even if
  // it were unverified. Used for screenshots and for handing someone a link.
  const want = new URLSearchParams(location.search).get("weapon");
  if (want) {
    const hit = DATA.weapons.find(w => w.page === want);
    if (hit) { SEL = hit; document.querySelector('.chip[data-f="verified"]').classList.remove("on"); }
  }
  render();
}

function visible() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const on = f => document.querySelector(`.chip[data-f="${f}"]`).classList.contains("on");
  return DATA.weapons.filter(w => {
    if (on("verified") && !w.verified) return false;
    // "独占" must mean neither half is shared. Filtering on the explosion row
    // alone let weapons with a shared impact row through as if they were safe
    // to edit alone.
    if (on("exclusive") && !(w.exclusive && w.impact_exclusive)) return false;
    if (on("explosion") && w.payload !== "explosion") return false;
    if (q) {
      const hay = `${w.page} ${w.ammo || ""}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function render() {
  const ul = document.getElementById("list");
  const rows = visible();
  ul.innerHTML = "";
  for (const w of rows) {
    const li = document.createElement("li");
    li.dataset.idx = w.damage_index;
    if (SEL && SEL.damage_index === w.damage_index && SEL.page === w.page) li.className = "sel";
    const badges = [];
    if (!w.verified) badges.push('<span class="badge b-unver">未验证</span>');
    // A weapon can share its explosion row, its impact row, or both - the two
    // are separate damage records with separate owners. Marking only the
    // explosion half hid 13 weapons whose impact row is shared, five of which
    // looked entirely exclusive in the list.
    // The shared badge names the segment, but only explosive weapons HAVE two
    // segments. For a plain projectile weapon the single damage row is just
    // "the damage" - calling it "explosion shared" on AR-23 and friends was
    // nonsense, since those weapons have no explosion at all.
    if (!w.exclusive) {
      badges.push(w.payload === "explosion"
        ? '<span class="badge b-shared">爆炸共享</span>'
        : '<span class="badge b-shared">共享</span>');
    }
    if (w.payload === "explosion" && !w.impact_exclusive) {
      badges.push('<span class="badge b-shared">直击共享</span>');
    }
    if (w.payload === "explosion") badges.push('<span class="badge b-expl">爆炸</span>');
    // Prefer the game's own name; fall back to the wiki's, marked so the user
    // knows which side it came from.
    const an = w.ammo ? w.ammo : (w.ammo_wiki ? w.ammo_wiki + " ⟨wiki⟩" : "(弹种未记录)");
    li.innerHTML = `<div><div class="nm">${w.page}</div>
        <div class="sub">${an} · ${w.damage}/${w.durable} AP${w.ap[0]}</div></div>
      <div>${badges.join(" ")}</div>`;
    li.onclick = () => { SEL = w; render(); };
    ul.appendChild(li);
  }
  renderMain();
}

function renderMain() {
  const main = document.getElementById("main");
  if (!SEL) { main.innerHTML = '<div class="empty">← 从左侧选择一把武器</div>'; return; }
  const w = SEL;

  let banner = "";
  if (!w.verified) {
    // The comparison is wiki vs the game's own table; a mismatch means one of
    // the two is stale, not that the game is wrong. Phrase it as an unresolved
    // discrepancy rather than telling the reader to go check by hand.
    banner += `<div class="banner bad"><b>未通过校验</b> —— 该武器的 wiki 数值与游戏记录不一致，
      说明其中一方已过时。当前显示的数值来自游戏记录，其行号可能不可靠。</div>`;
  }
  if (!w.exclusive) {
    // Shared rows are editable, so this is a statement of consequence rather
    // than an instruction: what changes, and what else it changes. No "tick
    // this box to proceed" - the control is visible below and speaks for
    // itself, and telling the reader what to do dates badly.
    banner += `<div class="banner warn"><b>共享伤害记录</b> —— 这条伤害记录同时被
      ${w.shared_with.map(p => `<code>${p}</code>`).join("、")} 使用。
      修改本条会一并改变这些武器${w.payload === "explosion"
        ? "的<b>爆炸伤害</b>" : "的伤害"}。</div>`;
  }
  if (w.payload === "explosion") {
    // Show the POSITION, not the type_id: the position is the row the mod
    // addresses. The type_id identifies the row but cannot be used as an index,
    // and the panel previously showed only that - so the number on screen was
    // not the number being written to.
    //
    // An explosive weapon deals damage in two independent halves, each with its
    // own values and its own set of owners, so both are shown and both can be
    // edited. The impact half used to be a bare row number, which hid half the
    // weapon's damage.
    const iv = w.impact_values;
    const ipos = w.impact_damage_position;
    if (iv) {
      const ishared = (w.impact_shared_with || []).length;
      banner += `<div class="banner ${ishared ? "warn" : "info"}">
        <b>弹头直击</b> —— 命中目标瞬间的伤害（记录 <code>#${ipos}</code>）：
        <code>${iv.damage}/${iv.durable}</code> AP <code>${iv.ap.slice(0,3).join("/")}</code>
        ${ishared ? `<br><span style="color:var(--warn)">⚠ 这条直击记录同时被
          ${w.impact_shared_with.map(p => `<code>${p}</code>`).join("、")} 使用，
          修改本条会一并改变这些武器的<b>弹头直击</b>伤害。</span>` : ""}
      </div>`;
      banner += `<div class="banner info">
        <b>爆炸伤害</b> —— 爆开后的范围伤害（记录 <code>#${w.damage_position}</code>）：
        <code>${w.damage}/${w.durable}</code> AP <code>${w.ap.slice(0,3).join("/")}</code>。
        总伤害 ≈ 直击 + 爆炸。
      </div>`;
    } else {
      banner += `<div class="banner info"><b>纯爆炸载荷</b> —— 这把武器没有独立的
        弹头直击记录，只有爆炸伤害（记录 <code>#${w.damage_position}</code>）。</div>`;
    }
  }

  // One editable block per damage segment. Explosive weapons have two
  // independent damage records (impact and explosion), each with its own
  // values, so each gets its own set of inputs - rather than one block plus a
  // checkbox deciding which record the numbers apply to, which is easy to
  // misread and impossible to edit both of at once.
  const fieldRow = (k, lab, val, prefix) => `
        <div class="row">
          <label>${lab}</label>
          <input type="number" id="f_${prefix}${k}" value="${val}"
                 data-key="${prefix}${k}" data-orig="${val}">
          <span class="was">原始 ${val}</span>
        </div>`;

  const damageRows = [
    ["damage", "肉伤 (Standard)", w.damage],
    ["durable", "耐伤 (Durable)", w.durable],
    ["ap0", "穿甲 · 直射", w.ap[0]],
    ["ap1", "穿甲 · 小角", w.ap[1]],
    ["ap2", "穿甲 · 大角", w.ap[2]],
    ["ap3", "穿甲 · 极端角", w.ap[3]],
    ["demolition_strength", "爆破力", w.forces[0]],
    ["force_strength", "硬直力", w.forces[1]],
    ["force_impulse", "推力", w.forces[2]],
  ];
  // Explosive weapons get one block per segment, each with its own inputs and
  // its own button, so both halves can be edited in one pass. Non-explosive
  // weapons get the single block they always had.
  const isExpl = !!(w.payload === "explosion" && w.impact_values);
  const iv = w.impact_values || {};
  const impactRows = [
    ["damage", "肉伤 (Standard)", iv.damage],
    ["durable", "耐伤 (Durable)", iv.durable],
    ["ap0", "穿甲 · 直射", (iv.ap || [])[0]],
    ["ap1", "穿甲 · 小角", (iv.ap || [])[1]],
    ["ap2", "穿甲 · 大角", (iv.ap || [])[2]],
    ["ap3", "穿甲 · 极端角", (iv.ap || [])[3]],
  ];

  const block = (title, note, rowList, prefix, seg) => `
    <div class="card">
      <h3>${title}</h3>
      ${note ? `<div class="note" style="margin-bottom:6px">${note}</div>` : ""}
      ${rowList.map(([k, lab, val]) => fieldRow(k, lab, val, prefix)).join("")}
      <div class="btns" style="margin-top:8px">
        <button class="primary seggen" data-seg="${seg}" data-prefix="${prefix}"
          ${w.verified ? "" : "disabled"}>生成 Mod</button>
        <button class="segadd" data-seg="${seg}" data-prefix="${prefix}"
          ${w.verified ? "" : "disabled"}>加入列表</button>
      </div>
    </div>`;

  const editors = isExpl
    ? block(
        `弹头直击 —— 记录 #${w.impact_damage_position}`,
        `命中目标瞬间的伤害。总伤害 ≈ 直击 + 爆炸。`,
        impactRows, "imp_", "impact")
      + block(
        `爆炸伤害 —— 记录 #${w.damage_position}`,
        `爆开后的范围伤害。`,
        damageRows, "", "damage")
    : block(`数值 —— 记录 #${w.damage_position}`, "", damageRows, "", "damage");

  const prov = w.wiki || {};
  const ammoCell = w.ammo
    ? `<code>${w.ammo}</code> <span style="color:var(--dim)">(游戏字符串表)</span>`
    : (w.ammo_wiki
        ? `<code>${w.ammo_wiki}</code> <span style="color:var(--dim)">(维基记录，游戏字符串表无此条目)</span>`
        : `<span style="color:var(--dim)">未记录</span>`);
  main.innerHTML = `
    <h2>${w.page}</h2>
    <div class="meta">
      弹种 ${ammoCell} ·
      载荷 <code>${w.payload}</code> ·
      伤害记录 <code>#${w.damage_position}</code>
      <span style="color:var(--dim)">(id ${w.damage_index})</span> ·
      初速 ${w.speed} m/s ·
      匹配方式 <code>${w.matched_by}</code>
    </div>
    ${banner}
    ${editors}
    <div class="card">
      <h3>来源校验</h3>
      <div class="note" style="line-height:1.9">
        游戏记录 vs Wiki：肉伤 ${fmt(w.damage)} / ${fmt(prov.standard)} ·
        耐伤 ${fmt(w.durable)} / ${fmt(prov.durable)} ·
        穿甲 ${w.ap[0]} / ${fmt(prov.ap)} ·
        初速 ${fmt(w.speed)} / ${fmt(prov.velocity)}
        ${w.verified ? '<span style="color:var(--ok)">✓ 全部一致</span>' : '<span style="color:var(--bad)">✗ 有不一致</span>'}
      </div>
    </div>
    <div class="btns">
      <button class="primary" id="gen" ${w.verified ? "" : "disabled"}>生成 Mod</button>
      <button id="queue" ${w.verified ? "" : "disabled"}>加入列表</button>
      <button id="reset">重置</button>
    </div>
    ${w.exclusive ? "" : `
    <label style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px">
      <input type="checkbox" id="allowshared">
      <span>允许修改共享记录 —— 勾选后本条改动会同时作用于上面列出的武器</span>
    </label>`}
    <div id="queuebox"></div>
    <div id="out" class="note" style="margin-top:10px"></div>
  `;

  const btn = document.getElementById("gen");
  const qbtn = document.getElementById("queue");
  // Generation is gated on the mapping being verified: a wrong row means the
  // edit lands on another weapon's record. Shared rows no longer block - that
  // is opt-in via a checkbox instead.
  if (btn && btn.disabled) {
    document.getElementById("out").innerHTML =
      "生成未开放：该武器<b>未通过校验</b>，数值来源存疑。";
  }
  if (btn) btn.onclick = () => generate("damage", "");
  if (qbtn) qbtn.onclick = () => addToQueue("damage", "");
  // Per-segment buttons live inside each block, so an explosive weapon's impact
  // and explosion halves can each be generated on their own.
  main.querySelectorAll(".seggen").forEach(b => {
    b.onclick = () => generate(b.dataset.seg, b.dataset.prefix);
  });
  main.querySelectorAll(".segadd").forEach(b => {
    b.onclick = () => addToQueue(b.dataset.seg, b.dataset.prefix);
  });
  document.getElementById("reset").onclick = () => renderMain();
  renderQueue();
  main.querySelectorAll("input[type=number]").forEach(inp => {
    inp.oninput = () => {
      inp.classList.toggle("changed", inp.value !== inp.dataset.orig);
    };
  });
}

// Several weapons can be edited in one mod. The first record located fixes the
// damage table's base address and the rest are addressed by offset, so N edits
// cost ONE address-space scan instead of N - which matters because the scan is
// what makes the game stutter while it runs.
let QUEUE = [];

function renderQueue() {
  const box = document.getElementById("queuebox");
  if (!box) return;
  if (!QUEUE.length) { box.innerHTML = ""; return; }
  const rows = QUEUE.map((e, i) => `
    <tr>
      <td>${e.label || e.weapon}</td>
      <td><code>${e.damage}/${e.durable}/AP${e.ap}</code></td>
      <td><button class="rm" data-i="${i}">移除</button></td>
    </tr>`).join("");
  box.innerHTML = `
    <div style="margin-top:12px">
      <b>待生成列表（${QUEUE.length} 项改动）</b>
      <div style="color:var(--dim);font-size:12px;margin:4px 0 6px">
        这些改动会打进同一个 Mod。运行时只需定位一次数据表，其余按偏移写入。
      </div>
      <table style="width:100%;font-size:13px;border-collapse:collapse">
        ${rows}
      </table>
      <div class="btns" style="margin-top:8px">
        <button class="primary" id="genall">生成 Mod（${QUEUE.length} 项改动）</button>
        <button id="clearq">清空</button>
      </div>
    </div>`;
  box.querySelectorAll(".rm").forEach(b => {
    b.onclick = () => { QUEUE.splice(parseInt(b.dataset.i, 10), 1); renderQueue(); };
  });
  document.getElementById("clearq").onclick = () => { QUEUE = []; renderQueue(); };
  document.getElementById("genall").onclick = () => generateAll();
}

function currentEdit(seg, prefix) {
  const w = SEL;
  // `prefix` selects which block's inputs to read: "" for the main/explosion
  // row set, "imp_" for the impact row set. Both exist at once on explosive
  // weapons, so the two segments can be edited independently.
  prefix = prefix || "";
  const num = k => {
    const el = document.getElementById("f_" + prefix + k);
    return el ? parseInt(el.value, 10) : NaN;
  };
  const angles = [num("ap0"), num("ap1"), num("ap2")];
  const allowBox = document.getElementById("allowshared");
  return { weapon: w.page, damage: num("damage"), durable: num("durable"),
           ap: num("ap0"), angles,
           // Shared rows are allowed only when the user ticks the box; the box
           // is only rendered for shared weapons.
           allow_shared: !!(allowBox && allowBox.checked),
           segment: seg || "damage" };
}

function addToQueue(seg, prefix) {
  const out = document.getElementById("out");
  const e = currentEdit(seg, prefix);
  if (e.angles.some(a => a !== e.angles[0])) {
    out.innerHTML = '<span style="color:var(--bad)">穿甲前三个角度不一致，生成器只接受一个穿甲等级。</span>';
    return;
  }
  if ([e.damage, e.durable, e.ap].some(Number.isNaN)) {
    out.innerHTML = '<span style="color:var(--bad)">数值必须是整数。</span>';
    return;
  }
  const label = e.weapon + (e.segment === "impact" ? "（弹头直击）" : "");
  e.label = label;
  // Match on weapon AND segment: the two halves of one explosive weapon are
  // separate edits and must be able to sit in the queue together.
  const i = QUEUE.findIndex(q => q.weapon === e.weapon && q.segment === e.segment);
  if (i >= 0) QUEUE[i] = e; else QUEUE.push(e);
  out.innerHTML = `<span style="color:var(--ok)">已加入列表：${label}</span>`;
  renderQueue();
}

async function generateAll() {
  const out = document.getElementById("out");
  if (!QUEUE.length) return;
  out.textContent = "生成中…";
  let res, data;
  try {
    res = await fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ edits: QUEUE }),
    });
    data = await res.json();
  } catch (e) {
    out.innerHTML = `<span style="color:var(--bad)">请求失败：${e}</span>`;
    return;
  }
  if (!data.ok) {
    out.innerHTML = `<div class="banner bad"><b>生成被拒绝</b><br>${data.error}</div>`;
    return;
  }
  const list = (data.edits || []).map(e =>
    `<li><b>${e.weapon}</b>：${Object.entries(e.changes).map(([k, v]) => `${k}→${v}`).join(", ")}</li>`
  ).join("");
  out.innerHTML = `<div class="banner info">
    <b>已生成（${data.weapons.length} 项改动）</b>
    <ul style="margin:6px 0">${list}</ul>
    ZIP：<code>${data.zip}</code>
  </div>`;
}

async function generate(seg, prefix) {
  const out = document.getElementById("out");
  const e = currentEdit(seg, prefix);
  const num = k => {
    const el = document.getElementById("f_" + (prefix || "") + k);
    return el ? parseInt(el.value, 10) : NaN;
  };
  const body = {
    weapon: SEL.page,
    damage: num("damage"),
    durable: num("durable"),
    ap: num("ap0"),
    allow_shared: e.allow_shared,
    segment: e.segment,
  };
  // The panel exposes all four AP angles; the generator takes one tier and
  // applies it to the first three. Refuse rather than silently pick one if the
  // user made them disagree.
  const angles = [num("ap0"), num("ap1"), num("ap2")];
  if (angles.some(a => a !== angles[0])) {
    out.innerHTML = '<span style="color:var(--bad)">穿甲前三个角度不一致，生成器只接受一个穿甲等级。</span>';
    return;
  }
  if ([body.damage, body.durable, body.ap].some(Number.isNaN)) {
    out.innerHTML = '<span style="color:var(--bad)">数值必须是整数。</span>';
    return;
  }

  out.textContent = "生成中…";
  let res, data;
  try {
    res = await fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    data = await res.json();
  } catch (e) {
    out.innerHTML = `<span style="color:var(--bad)">请求失败：${e}</span>`;
    return;
  }
  if (!data.ok) {
    out.innerHTML = `<div class="banner bad"><b>生成被拒绝</b><br>${data.error}</div>`;
    return;
  }
  const ch = Object.entries(data.changes)
    .map(([k, v]) => `${k}→${v}`).join(", ");
  out.innerHTML = `<div class="banner info">
    <b>已生成</b><br>
    改动：<code>${ch}</code><br>
    槽位 <code>${data.slot}</code>（<code>${data.slot_hash}</code>）<br>
    归档 ${data.archive_bytes.toLocaleString()} 字节 · sha256 <code>${data.archive_sha256.slice(0, 16)}…</code><br>
    ZIP：<code>${data.zip}</code><br>
    <span style="color:var(--dim)">用 Arsenal 导入这个 ZIP。需要先安装并启用
    Bingus Shared Loader（v14 或更高版本）。</span>
  </div>`;
}

document.addEventListener("input", e => {
  if (e.target.id === "q") render();
});
document.addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (chip) { chip.classList.toggle("on"); render(); }
});
boot();
</script>
